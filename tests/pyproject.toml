[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt2lab"
version = "0.1.0"
description = "A small, well-separated GPT-2 training codebase."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "tiktoken>=0.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

