[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt2-lab"
version = "0.1.0"
description = "A from-scratch GPT-2 training lab"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "tiktoken>=0.5",
    "matplotlib>=3.7",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

