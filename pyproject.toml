[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gpt2-lab"
version = "1.0.0"
description = "A maintainable, from-scratch GPT-2 training lab"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Mostafa Karimzadeh" }]
keywords = ["gpt-2", "language-model", "pytorch", "education"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "requests>=2.32,<3",
  "tiktoken>=0.8,<1",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7,<4"]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "matplotlib>=3.7,<4",
  "mypy>=1.11",
  "numpy>=1.26,<2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[project.scripts]
gpt2lab = "gpt2lab.cli:main"

[project.urls]
Homepage = "https://github.com/MostafaK66/gpt2-lab"
Repository = "https://github.com/MostafaK66/gpt2-lab"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt2lab"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["gpt2lab"]
omit = ["src/gpt2lab/__main__.py"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  '\.\.\.',
]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
pretty = true
show_error_codes = true
warn_unreachable = true
